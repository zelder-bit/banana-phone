name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Tests and the walkthrough check are pure JS: skip native builds and the Electron download.
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - name: Walkthrough matches the code
        run: node scripts/check-walkthrough.js

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # a hung app must not hold the runner for hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The real app this time: download Electron and build node-pty for it (postinstall).
      - run: npm ci
      # xvfb-run gives Electron a virtual display; CI=true (set by GitHub) adds --no-sandbox.
      - run: xvfb-run -a npm run test:ui
      # The RDP certificate probe again, inside Electron: its TLS library (BoringSSL) is stricter than Node's.
      - run: npm run test:electron

  # Shared folders for real: the guacd image from Docker Hub, and an xrdp server standing in for Windows.
  share:
    # 24.04 on purpose: its xrdp (0.9) shows a redirected drive as a folder in the session, which is how the
    # test looks at it. With the xrdp of 26.04 (0.10.1) the drive is announced but that folder never appears.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Start an RDP server (xrdp) with a throwaway account
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xrdp xorgxrdp fuse3
          # No desktop is needed: the session only has to stay logged in.
          printf '#!/bin/sh\nexec sleep 100000\n' | sudo tee /etc/xrdp/startwm.sh > /dev/null
          echo 'allowed_users=anybody' | sudo tee /etc/X11/Xwrapper.config > /dev/null
          # Its own certificate, readable by the xrdp service, so the server offers TLS (the app refuses legacy RDP security).
          sudo rm -f /etc/xrdp/cert.pem /etc/xrdp/key.pem
          sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=xrdp-ci -keyout /etc/xrdp/key.pem -out /etc/xrdp/cert.pem
          sudo chmod 644 /etc/xrdp/key.pem
          password=$(openssl rand -hex 16)
          echo "::add-mask::$password"
          sudo useradd -m bp-rdp
          echo "bp-rdp:$password" | sudo chpasswd
          echo "BP_RDP_PASSWORD=$password" >> "$GITHUB_ENV"
          sudo systemctl restart xrdp-sesman xrdp
          # The service returns before the port is open.
          timeout 30 bash -c 'until (echo > /dev/tcp/127.0.0.1/3389) 2>/dev/null; do sleep 1; done'
      - run: npm run test:share
        env:
          BP_RDP_USER: bp-rdp
      - name: What xrdp said, if it failed
        if: failure()
        run: |
          sudo journalctl -u xrdp -u xrdp-sesman --no-pager | tail -60
          sudo tail -40 /var/log/xrdp.log /var/log/xrdp-sesman.log || true
          sudo -u bp-rdp sh -c 'cat ~/.local/share/xrdp/xrdp-chansrv.*.log | grep -v "sound_process\|wFormat\|nChannels\|nSamples\|nAvgBytes\|nBlockAlign\|wBitsPerSample\|cbSize"' || true
          lsb_release -ds; xrdp --version | head -3; sed -n '/^\[Chansrv\]/,$p' /etc/xrdp/sesman.ini | grep -v '^;\|^$' | head -20
          ls -la /dev/fuse; command -v fusermount3 fusermount; dpkg -l | grep -i 'xrdp\|fuse' | awk '{print $2, $3}'
          pid=$(pgrep -f xrdp-chansrv | head -n 1); echo "chansrv $pid"; sudo readlink /proc/1/ns/mnt "/proc/$pid/ns/mnt"
          sudo grep -i 'fuse\|thinclient' "/proc/$pid/mountinfo" || echo "no fuse mount in the session"
          sudo ls -la "/proc/$pid/root$(getent passwd bp-rdp | cut -d: -f6)/" || true
          systemctl cat xrdp-sesman | grep -v '^#' | grep -i 'protect\|private\|namespace\|ReadWrite\|ExecStart' || true
